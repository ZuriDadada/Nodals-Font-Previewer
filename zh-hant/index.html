
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodals Font</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-taipei-sans-tc@0.0.1/dist/index.css"
    >
    <link
    rel="stylesheet"
    href="https://nodals.ccwu.cc/base.css"
    >
    <link rel="stylesheet" href="/style.css?v=0.3">
</head>

<body>
    <header>
        <h1>Nodals Font</h1>
        <p>Font Previewer</p>
    </header>

    <main>
        <!-- 字體管理區 -->
        <section id="font-manager">
            <h2>字體管理</h2>

            <div class="font-upload-control">
                <input
                    type="file"
                    id="font-upload"
                    accept=".ttf,.otf,.woff,.woff2,.zip"
                    multiple
                >
            </div>

            <div class="font-url-control">
                <input
                    type="url"
                    id="font-url"
                    placeholder="請輸入字體下載地址……"
                >
                <button id="load-font-url">載入字體</button>
            </div>

            <p id="font-url-status" aria-live="polite"></p>

            <div id="font-list">
                尚未載入字體
            </div>
        </section>

        <!-- 文本編輯區 -->
        <section id="editor">
            <h2>文本編輯</h2>

            <div id="editor-blocks">
                <div class="editor-block">
                    <label>選擇字體：</label>
                    <select class="font-select">
                        <option value="">請選擇字體</option>
                    </select>
                    
                    <label>字級：</label>
                    <div class="slider-control">
                        <input
                            type="range"
                            class="font-size"
                            min="8"
                            max="96"
                            value="24"
                            step="1"
                        >
                        <input
                            type="number"
                            class="font-size-number"
                            min="8"
                            max="96"
                            value="24"
                            step="1"
                        >
                        <span>px</span>
                    </div>

                    <label>字重：</label>
                    <div class="slider-control">
                        <input
                            type="range"
                            class="font-weight"
                            min="100"
                            max="900"
                            value="400"
                            step="1"
                        >
                        <input
                            type="number"
                            class="font-weight-number"
                            min="100"
                            max="900"
                            value="400"
                            step="1"
                        >
                    </div>

                    <label>輸入文本：</label>
                    <textarea placeholder="請輸入預覽文字……"></textarea>
                </div>
            </div>

            <button id="add-block">新增文本區塊</button>
        </section>

        <!-- 預覽區 -->
        <section id="preview">
            <h2>字體預覽</h2>

            <div id="preview-area">
                預覽內容將顯示於此
            </div>
        </section>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
    ></script>
    <script src="/app.js"></script>
</body>
</html>
